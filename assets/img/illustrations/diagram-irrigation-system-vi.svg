<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Giải pháp tưới tiêu off-grid cho rẫy của HearS: dàn pin mặt trời, bộ điều khiển bơm, bơm từ giếng khoan hoặc ao hồ, bồn chứa, đường ống tưới nhỏ giọt theo hàng cây, tùy chọn cảm biến độ ẩm đất và giám sát từ xa"><title>Giải pháp tưới tiêu off-grid cho rẫy của HearS: dàn pin mặt trời, bộ điều khiển bơm, bơm từ giếng khoan hoặc ao hồ, bồn chứa, đường ống tưới nhỏ giọt theo hàng cây, tùy chọn cảm biến độ ẩm đất và giám sát từ xa</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10263D"/></marker></defs><rect width="1200" height="800" fill="#FFFFFF"/><rect width="1200" height="10" fill="#D70000"/><text x="600" y="62" font-family="Inter, Arial, Helvetica, sans-serif" font-size="32" font-weight="800" text-anchor="middle" fill="#10263D">Tưới tiêu off-grid cho rẫy</text><circle cx="90" cy="130" r="34" fill="#F4B400"/><g transform="translate(70 170) skewX(-18)"><rect width="150" height="70" fill="#10263D" rx="3"/><line x1="38" y1="0" x2="38" y2="70" stroke="#4A6584" stroke-width="2"/><line x1="75" y1="0" x2="75" y2="70" stroke="#4A6584" stroke-width="2"/><line x1="112" y1="0" x2="112" y2="70" stroke="#4A6584" stroke-width="2"/><line x1="0" y1="35.0" x2="150" y2="35.0" stroke="#4A6584" stroke-width="2"/></g><g transform="translate(240 170) skewX(-18)"><rect width="150" height="70" fill="#10263D" rx="3"/><line x1="38" y1="0" x2="38" y2="70" stroke="#4A6584" stroke-width="2"/><line x1="75" y1="0" x2="75" y2="70" stroke="#4A6584" stroke-width="2"/><line x1="112" y1="0" x2="112" y2="70" stroke="#4A6584" stroke-width="2"/><line x1="0" y1="35.0" x2="150" y2="35.0" stroke="#4A6584" stroke-width="2"/></g><line x1="90" y1="240" x2="90" y2="300" stroke="#10263D" stroke-width="4"/><line x1="190" y1="240" x2="190" y2="300" stroke="#10263D" stroke-width="4"/><line x1="260" y1="240" x2="260" y2="300" stroke="#10263D" stroke-width="4"/><line x1="360" y1="240" x2="360" y2="300" stroke="#10263D" stroke-width="4"/><text x="240" y="330" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#10263D">Dàn pin mặt trời</text><rect x="500" y="170" width="200" height="110" rx="10" fill="#FFFFFF" stroke="#D70000" stroke-width="3"/><text x="600" y="216" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#10263D">Bộ điều khiển bơm</text><text x="600" y="240" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#10263D">(MPPT, bảo vệ)</text><line x1="400" y1="205" x2="496" y2="205" stroke="#D70000" stroke-width="4" marker-end="url(#ah)"/><rect x="520" y="420" width="24" height="230" fill="#F3F5F7" stroke="#10263D" stroke-width="3"/><rect x="525" y="600" width="14" height="40" fill="#D70000"/><text x="470" y="690" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#10263D">Giếng khoan:</text><text x="470" y="712" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#10263D">bơm chìm</text><ellipse cx="730" cy="640" rx="110" ry="28" fill="#CFE3F5" stroke="#10263D" stroke-width="2"/><rect x="700" y="575" width="40" height="30" rx="6" fill="#D70000"/><text x="730" y="700" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#10263D">Ao, hồ, suối:</text><text x="730" y="722" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#10263D">bơm bề mặt</text><line x1="560" y1="282" x2="532" y2="418" stroke="#10263D" stroke-width="3" marker-end="url(#ah)"/><line x1="640" y1="282" x2="716" y2="572" stroke="#10263D" stroke-width="3" marker-end="url(#ah)"/><rect x="860" y="150" width="120" height="150" rx="8" fill="#CFE3F5" stroke="#10263D" stroke-width="3"/><rect x="870" y="300" width="10" height="70" fill="#10263D"/><rect x="960" y="300" width="10" height="70" fill="#10263D"/><text x="920" y="395" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#10263D">Bồn chứa nước</text><path d="M736 575 V520 H900 V302" fill="none" stroke="#5B6876" stroke-width="4"/><path d="M552 430 V520 H736" fill="none" stroke="#5B6876" stroke-width="4"/><path d="M980 260 H1040 V440" fill="none" stroke="#5B6876" stroke-width="4"/><line x1="1040" y1="450" x2="1170" y2="450" stroke="#5B6876" stroke-width="3" stroke-dasharray="2 10"/><circle cx="1065" cy="432" r="15" fill="#1D674F"/><circle cx="1105" cy="432" r="15" fill="#1D674F"/><circle cx="1145" cy="432" r="15" fill="#1D674F"/><line x1="1040" y1="520" x2="1170" y2="520" stroke="#5B6876" stroke-width="3" stroke-dasharray="2 10"/><circle cx="1065" cy="502" r="15" fill="#1D674F"/><circle cx="1105" cy="502" r="15" fill="#1D674F"/><circle cx="1145" cy="502" r="15" fill="#1D674F"/><line x1="1040" y1="590" x2="1170" y2="590" stroke="#5B6876" stroke-width="3" stroke-dasharray="2 10"/><circle cx="1065" cy="572" r="15" fill="#1D674F"/><circle cx="1105" cy="572" r="15" fill="#1D674F"/><circle cx="1145" cy="572" r="15" fill="#1D674F"/><circle cx="1150" cy="470" r="7" fill="none" stroke="#5B6876" stroke-width="2" stroke-dasharray="3 3"/><circle cx="1150" cy="540" r="7" fill="none" stroke="#5B6876" stroke-width="2" stroke-dasharray="3 3"/><text x="1080" y="620" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#10263D">Ống tưới nhỏ giọt</text><text x="1080" y="641" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#10263D">hoặc phun</text><text x="1080" y="670" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#5B6876">Cà phê, tiêu, sầu riêng…</text><rect x="60" y="420" width="300" height="90" rx="12" fill="#FFFFFF" stroke="#5B6876" stroke-width="2" stroke-dasharray="10 8"/><text x="210" y="456" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#5B6876">Tùy chọn: cảm biến độ ẩm</text><text x="210" y="478" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#5B6876">đất, giám sát từ xa</text><rect x="60" y="560" width="300" height="90" rx="12" fill="#FFFFFF" stroke="#5B6876" stroke-width="2" stroke-dasharray="10 8"/><text x="210" y="596" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#5B6876">Tùy chọn: điện lưới</text><text x="210" y="618" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#5B6876">hoặc máy phát dự phòng</text><line x1="362" y1="465" x2="498" y2="272" stroke="#5B6876" stroke-width="2" stroke-dasharray="8 6"/><line x1="362" y1="605" x2="520" y2="282" stroke="#5B6876" stroke-width="2" stroke-dasharray="8 6"/><rect x="0" y="756" width="1200" height="44" fill="#10263D"/><text x="28" y="785" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#FFFFFF">HearS</text><text x="1172" y="785" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="end" fill="#B8C7D6">Sơ đồ do HearS thực hiện – minh họa, không theo tỉ lệ; nét đứt là tùy chọn</text></svg>